[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "field-twin"
version = "0.1.0"
description = "Прототип цифрового двойника газового промысла над АСУ ТП"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
field-twin-generate = "field_twin.simulator:main"
field-twin-ingest = "field_twin.ingest:main"
field-twin-journal = "field_twin.journal:main"
field-twin-quality = "field_twin.quality:main"
field-twin-run = "field_twin.cycle:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
