[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "field-twin"
version = "0.1.0"
description = "Прототип цифрового двойника газового промысла над АСУ ТП"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2",
    "optuna>=3.6",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "asyncua>=1.1",
    "paho-mqtt>=2.0",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "amqtt>=0.11"]
hysys = ["pywin32; platform_system == 'Windows'"]

[project.scripts]
field-twin-generate = "field_twin.simulator:main"
field-twin-ingest = "field_twin.ingest:main"
field-twin-journal = "field_twin.journal:main"
field-twin-quality = "field_twin.quality:main"
field-twin-run = "field_twin.cycle:main"
field-twin-hydrates = "field_twin.hydrates:main"
field-twin-chudin = "field_twin.chudin_models:main"
field-twin-serve = "field_twin.api:main"
field-twin-playback = "field_twin.playback:main"
field-twin-gateway = "field_twin.gateway.service:main"
field-twin-asu-sim = "asu_simulator.opcua_server:main"

[tool.setuptools]
packages = ["field_twin", "field_twin.gateway", "field_twin.cores", "asu_simulator"]

[tool.setuptools.package-dir]
"" = "src"
asu_simulator = "asu_simulator"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
