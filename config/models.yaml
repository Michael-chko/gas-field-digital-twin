# Модели двойника (М3, М4). Параметры, взятые из источников, отмечены; остальное — решения прототипа.

hydrates:                       # М3, Сафронова
  stream: absorber
  objects: [A-1, A-2]           # абсорберы; общие параметры установки берутся с объекта plant_object
  plant_object: UKPG-1V
  methanol_stream: methanol     # расход метанола по точкам — в признаки, если есть (оценка целостности данных)
  lags: [1, 200]                # изменения за 1 шаг (2 мин) и за 200 шагов (400 мин) — Сафронова
  step: 2min                    # интервал регистрации около 2 мин — Сафронова
  threshold: 0.5                # вероятность, выше которой выход модели = 1
  test_share: 0.3               # доля конца ряда на проверку
  optuna_trials: 15             # перебор параметров CatBoost инструментом Optuna — Сафронова
  seed: 42
  model_path: data/models/hydrates.cbm
  # Ориентиры из статьи, а не критерии приёмки: точность 0,993; полнота 0,961; F1 0,977; доля 0,933.
  reference_metrics: {precision: 0.993, recall: 0.961, f1: 0.977, accuracy: 0.933}

chudin:                         # М4, Чудин; адаптация и связка — Еникеев, Топольников
  train_share: 0.6              # деление выборки 60 / 40 % — Чудин
  step: 1d                      # суточные данные — Чудин; шаг связывающего алгоритма
  dks:
    object_id: DKS-1
    inputs: [P_in, P_out, Q]               # давления на входе и выходе компрессора, расход — Чудин
    outputs: [N_power, n_speed]            # мощность и скорость вращения — Чудин
    hidden_layers: [32, 32, 32, 32, 32]    # 5 скрытых слоёв — Чудин; ширина слоёв — решение прототипа
    activation: relu                        # в источнике не указано
    max_iter: 3000
    reference_error_pct: {N_power: 1.9}    # ориентир средней ошибки по мощности — Чудин
  transport:
    plume_object: K-1
    wells: [W-101, W-102, W-103, W-104]
    # 10 входов — Чудин: суммарный расход по шлейфу, давление на входе в ЗПА, буферные давления
    # и температуры четырёх скважин; выход — дебиты скважин.
    hidden_layers: [4]                      # 1 скрытый слой из 4 нейронов — Чудин
    activation: tanh                        # в источнике не указано
    max_iter: 5000
    reference_error_pct: {forecast_74d: 2.0}   # ошибка прогноза на 74 дня не более 2 % — Чудин
  seed: 0
  # Связывающий алгоритм: доля расхода ДКС, которую даёт этот куст (остальные кусты в прототипе
  # не моделируются) — решение прототипа.
  dks_flow_factor: 3.6
  model_path: data/models/chudin.joblib

stops:                          # М10, Савченко и соавторы
  stream: wells
  rate_parameter: Q_gas         # для газовых скважин — нулевой дебит (в статье — нулевой ток насоса)
  pressure_parameter: P_wellhead
  min_hours: {high: 4, low: 12} # минимальная длительность остановки по проницаемости — Савченко и соавторы
  use_smoothed: true            # брать сглаженное давление М2, если сглаживание включено

scc:                            # модель КРН участков газопроводов — Мирзоев, Иващенко, Маршаков, 2016
  stream: pipeline_segments
  # 10 входов (9 факторов табл. 1; последний разложен на два — допущение прототипа)
  inputs: [soil_resistivity, soil_ph, sulfides, carbonates, hydrogen_permeation, o2_limit_current,
           anodic_current, distance_from_cs, watercourse, off_design_groundwater]
  log_inputs: [soil_resistivity, sulfides, carbonates, hydrogen_permeation, o2_limit_current, anodic_current]
  hidden_layers: [13]           # 1 скрытый слой из 13 нейронов — статья
  activation: logistic          # сигмоида в скрытом слое, линейный выходной слой (2 выхода) — статья
  solver: lbfgs                 # в статье — настройки Statistica 10 по умолчанию; lbfgs ближе всего к BFGS
  alpha: 1.0                    # L2-регуляризация против переобучения на 258 примерах — решение прототипа
  samples: 368                  # объём выборки статьи; синтетика того же объёма
  test_examples: 55             # тестовая и перекрёстная выборки по 55 примеров, случайно — статья
  validation_examples: 55
  seed: 0
  # Ориентиры статьи (табл. 2), не критерии приёмки: верно без КРН 80,43 %, с КРН 81,52 %, всего 80,98 %.
  reference: {no_scc_pct: 80.43, scc_pct: 81.52, total_pct: 80.98}
  risk_classes:                 # рис. 4 статьи — сверить
    - {name: низкий, from: 0.0}
    - {name: умеренный, from: 0.1}
    - {name: средний, from: 0.23}
    - {name: высокий, from: 0.3}
    - {name: критичный, from: 0.4}
  applicability:                # на других участках — шурфы; модель адекватна при совпадении ≥ 75 % — статья
    min_pits: 10
    min_match: 0.75
  domain_class: trunk           # область исходной модели — магистральные газопроводы
  model_path: data/models/scc.joblib
