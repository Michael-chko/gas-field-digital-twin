# Модели двойника (М3, М4). Параметры, взятые из источников, отмечены; остальное — решения прототипа.

hydrates:                       # М3, Сафронова
  stream: absorber
  objects: [A-1, A-2]           # абсорберы; общие параметры установки берутся с объекта plant_object
  plant_object: UKPG-1V
  methanol_stream: methanol     # расход метанола по точкам — в признаки, если есть (оценка целостности данных)
  lags: [1, 200]                # изменения за 1 шаг (2 мин) и за 200 шагов (400 мин) — Сафронова
  step: 2min                    # интервал регистрации около 2 мин — Сафронова
  threshold: 0.5                # вероятность, выше которой выход модели = 1
  test_share: 0.3               # доля конца ряда на проверку
  optuna_trials: 15             # перебор параметров CatBoost инструментом Optuna — Сафронова
  seed: 42
  model_path: data/models/hydrates.cbm
  # Ориентиры из статьи, а не критерии приёмки: точность 0,993; полнота 0,961; F1 0,977; доля 0,933.
  reference_metrics: {precision: 0.993, recall: 0.961, f1: 0.977, accuracy: 0.933}
