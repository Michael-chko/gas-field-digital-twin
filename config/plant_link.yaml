# Стык с заводом (М11): откуда брать данные для сообщения «промысел → завод».
volume_signal: [gathering, SEP-1, Q_sep]       # объём газа на завод, тыс. м³/ч
drive_power_signals:                           # доступная мощность приводов, МВт
  GTU-T32-1: [gtu, GTU-T32-1, N_power]
  DKS-1: [dks, DKS-1, N_power]
# Окна снабжения: судам снабжения с динамическим позиционированием маршрут Мурманск — Харасавэй
# доступен 190 дней в году (Васин и соавторы, 2025). Даты — условные, задаёт логистика.
windows:
  - {kind: supply, start: '2026-06-15T00:00:00+05:00', end: '2026-12-22T00:00:00+05:00', note: 'навигация Мурманск — Харасавэй, 190 сут'}
