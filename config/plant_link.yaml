# Стык с заводом (М11): откуда брать данные для сообщения «промысел → завод».
volume_signal: [gathering, SEP-1, Q_sep]       # объём газа на завод, тыс. м³/ч
drive_power_signals:                           # доступная мощность приводов, МВт
  GTU-T32-1: [gtu, GTU-T32-1, N_power]
  DKS-1: [dks, DKS-1, N_power]
# Окна снабжения: маршрут Мурманск — Харасавэй — навигационный период 110 сут, суда река-море
# класса «М-СП» и морские суда с осадкой до 2,4 м (Васин и соавторы, 2025, табл. 2, с. 172;
# 190 сут в таблице — для судов DPS на Штокман). Даты — условные, задаёт логистика.
windows:
  - {kind: supply, start: '2026-06-15T00:00:00+05:00', end: '2026-10-03T00:00:00+05:00', note: 'навигация Мурманск — Харасавэй, 110 сут'}
