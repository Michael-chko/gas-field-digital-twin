# Пороги правил уведомлений П1–П16 (ТЗ, раздел «Правила уведомлений»).
# Пороги хранятся здесь, а не в коде. null — порога нет в источниках: правило не
# срабатывает, пока пользователь не задаст значение (ТЗ, «Открытые вопросы»).
# recipient: operator — оператор пульта, chief_engineer — главный инженер,
# configurable — адресат в источнике не указан, настраивается (ТЗ: «Для П2–П11 получатель
# настраивается»); пока такие уведомления получает configurable_recipient.

configurable_recipient: chief_engineer

П1:
  event: Гидраты в абсорбере
  min_positive: 3            # 3 и более положительных значения модели М3 ...
  window_minutes: 20         # ... за 20 минут (Сафронова, 2026, с. 115)
  recipient: operator
  source: Сафронова

П2:
  event: Состояние оснований
  yellow_from: [2, 3]        # от 2/3 предела — жёлтый (Затырко и соавторы, 2024, с. 166)
  red_from: [1, 1]           # на пределе и выше — красный
  recipient: configurable
  source: Затырко и соавторы

П3:
  event: Скорость вертикального смещения
  max_mm_per_year: 15        # рекомендованный предел (Затырко и соавторы, 2024, с. 170)
  trend_min_days: 30         # тренд считается по ряду не короче 30 суток — решение прототипа
  recipient: configurable
  source: Затырко и соавторы

П4:
  event: Неравномерность осадки фундаментов обвязки
  max_mm_per_m: 2            # предел по нормативной документации (Затырко и соавторы, 2024, с. 170)
  recipient: configurable
  source: Затырко и соавторы

П5:
  event: Скорость газа в газопроводе
  max_m_per_s: 20            # СТО Газпром 2-3.5-454-2010 (Долгов, Пожидаев, 2026, с. 90)
  recipient: configurable
  source: Долгов, Пожидаев

П6:
  event: Температура за турбиной Т-32
  # Температура продуктов сгорания за турбиной: номинальная 510 °C, максимальная длительная 600 °C
  # (Поярков, Филиппов, Юн — АО «Невский завод», 2026, табл. 1, с. 165)
  max_c: 600
  nominal_c: 510
  recipient: configurable
  source: Поярков, Филиппов, Юн (Невский завод)

П7:
  event: Ухудшение ГТУ Т-32 за межремонтный период
  # «Снижение параметров ГТУ по сравнению с номинальными значениями за межремонтный период, %,
  # не более: мощность 4, КПД 2» (Поярков, Филиппов, Юн, 2026, табл. 1, с. 165).
  max_power_drop_pct: 4
  max_efficiency_drop_pct: 2
  # Отсчёт — от номинала (как в источнике). Номинал в станционных условиях: мощность не менее
  # 31,2 МВт, эффективный КПД не менее 36 % (там же). period_start — прежний режим прототипа.
  baseline: nominal
  nominal: {N_power: 31.2, efficiency: 36}
  # Текущее значение — скользящее среднее за baseline_hours. Окно — решение прототипа.
  # Проценты — относительные (доля номинала); для КПД в таблице не уточнено («Открытые вопросы»).
  baseline_hours: 24
  recipient: configurable
  source: Поярков, Филиппов, Юн (Невский завод)

П8:
  event: Устойчивость осевого компрессора
  surge_margin_min_pct: 14   # запас ГДУ ОК 14…20 % (Поярков, Филиппов, Юн, 2026, с. 166)
  surge_margin_max_pct: 20
  recipient: configurable
  source: Поярков, Филиппов, Юн (Невский завод)

П9:
  event: Срок безопасной эксплуатации газопровода
  # Срок менее 5 лет — экспертная организация даёт рекомендации, вплоть до капремонта
  # (Харионовский, Велиюлин, Городниченко, 2026, с. 197, со ссылкой на СТО Газпром 2-3.5-252-2008).
  # Срок считается по формуле (1) статьи модулем field_twin.safe_life, если есть данные ВТД.
  min_years: 5
  recipient: configurable
  source: Харионовский и соавторы

П10:
  event: Неработающая электрохимическая защита
  # «Ток или средний защитный потенциал близок или равен нулю» (Запевалов и соавторы, 2026, с. 79).
  # Что считать «близким к нулю», в оригинале не сказано (проверено). TODO: «Открытые вопросы».
  near_zero_abs: null
  recipient: configurable
  source: Запевалов и соавторы

П11:
  event: Пропуск обслуживания электрохимической защиты
  # ТО не реже 2 раз в месяц — катодные, 4 раз в месяц — дренажные, 1 раза в 6 месяцев —
  # протекторные (Запевалов и соавторы, 2026, с. 78).
  min_measurements:
    cathodic:  {count: 2, period_days: 30}
    drainage:  {count: 4, period_days: 30}
    protector: {count: 1, period_days: 182}
  recipient: configurable
  source: Запевалов и соавторы

П12:
  event: Рекомендация расчётного ядра
  # «Система предлагает вариант, решение за человеком» (Войтенков, 2025, с. 134).
  # Адресат в статье не указан — главный инженер выбран в прототипе.
  recipient: chief_engineer
  source: Войтенков

П13:
  event: Устаревшие данные
  stale_after_intervals: 2   # поток не обновлялся дольше двух своих интервалов (оценка целостности данных)
  recipient: operator
  source: Оценка целостности данных

П14:
  event: Расхождение связанных датчиков
  min_pearson: null          # порог в оригинале не задан (Шевченко, Рычков, 2026, с. 49–50). TODO: «Открытые вопросы»
  recipient: operator
  source: Шевченко, Рычков

П15:
  event: Модель расходится с замерами
  max_error_pct: null        # порог в источнике не задан (Григорьев и соавторы; Еникеев, Топольников)
  recipient: chief_engineer
  source: Григорьев и соавторы; Еникеев, Топольников

П16:
  event: Остаток C5+ выше допуска завода
  max_c5plus_g_m3: null      # порог задаёт пользователь (продольный разбор)
  recipient: chief_engineer
  source: Продольный разбор

# Правило сверх ТЗ: добавлено вместе с моделью КРН (Мирзоев, Иващенко, Маршаков, 2016).
П17:
  event: Высокий риск стресс-коррозии (КРН) участка газопровода
  # Классы риска с рис. 4 статьи (прототип программы): низкий 0–0,1; умеренный 0,1–0,23;
  # средний 0,23–0,3; высокий 0,3–0,4; критичный 0,4–1. Границы прочитаны с мелкого рисунка —
  # сверить с оригиналом. Уведомление — с класса «высокий».
  risk_from: 0.3
  recipient: chief_engineer
  source: Мирзоев, Иващенко, Маршаков
