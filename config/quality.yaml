# Приём (М1) и контроль качества данных (М2).

ingest:
  # Разделитель и кодировка CSV задаются в настройках (Запевалов и соавторы).
  delimiter: ','
  encoding: utf-8
  # Все времена приводятся к одному часовому поясу (ТЗ, М1).
  target_timezone: UTC
  # Допустимые признаки качества значения и состояния оборудования (ТЗ, «Требования к каждой записи»).
  quality_values: [good, uncertain, bad]
  equipment_states: [run, stop, repair]   # работа, остановка, ремонт

# --- М2 ---

# Физические пределы по роли параметра (kind в tags.yaml). Это не уставки, а физика:
# уровень и открытие клапана в процентах, расход неотрицателен, температура не ниже абсолютного
# нуля. Нули давления — нефизичные значения (Савченко и соавторы): min_exclusive.
physical_ranges:
  level:       {min: 0, max: 100}
  level_mm:    {min: 0}            # уровень в мм (абсорбер, табл. 2 Сафроновой)
  valve:       {min: 0, max: 100}
  flow:        {min: 0}
  pressure:    {min: 0, min_exclusive: true}
  temperature: {min: -273.15}

# Допустимые диапазоны параметров (Савченко и соавторы). В источниках не даны — задаёт
# пользователь. Сужают физические пределы. Формат: "<stream>.<parameter>": {min: ..., max: ...}
ranges: {}

# Выбросы: значения за пределами трёх стандартных отклонений (критерий Шевченко, Рычкова).
# Выбросы только помечаются; исключение подтверждает пользователь.
outliers:
  sigma: 3

# Аномальное давление при нулевом расходе (Шевченко, Рычков): во время простоя давление
# нефизично или выходит за sigma стандартных отклонений рабочего режима. На скважинах рост
# давления после остановки — физика (Савченко и соавторы), его разбирает М10.
zero_flow_pressure:
  exclude_streams: [wells]
  # «Аномально большое» в источнике не количественно; 5σ — решение прототипа, чтобы обычный
  # шум во время простоя не давал ложных пометок (при 3σ — около 0,3 % точек).
  sigma: 5

# Пары связанных датчиков для корреляции Пирсона (Шевченко, Рычков:
# давления на входе и выходе сепаратора). Используются в критериях М2 и в правиле П14.
correlated_pairs:
  - {stream: gathering, a: SEP-1.P_in, b: SEP-1.P_out}

# Окно расчёта корреляции для П14 — решение прототипа (в источниках не задано).
pearson:
  window: 2h
  min_points: 12

# Сглаживание рядов давления полиномом (Савченко и соавторы, 2024, с. 149): точки, у которых
# абсолютное отклонение от полинома пятой степени больше 0,5×10⁶ Па, удаляются, полином
# перестраивается по оставшимся точкам; полином строится по всему периоду (без окна).
# threshold_mode: absolute — порог в единицах параметра (МПа); sigma — в стандартных отклонениях
# остатков (прежний режим прототипа). window: null — весь ряд, иначе число точек в окне.
# Выключено (enabled: false): в статье — нефтяные скважины с датчиком ТМС на приёме УЭЦН, а шкала
# рис. 1 (80–94 «10⁶ Па») заставляет сомневаться в единицах; для газовых скважин Харасавэя нужно
# подтверждение («Открытые вопросы»). Там же (с. 149) — фильтр нефизичных значений давления
# «более 350×10⁶ Па и менее 10×10⁶ Па»; в ranges не перенесён по той же причине.
smoothing:
  enabled: false
  series: [wells.P_wellhead, wells.P_bottomhole]
  degree: 5
  threshold_mode: absolute
  threshold: 0.5
  window: null
